version: "3.8"

services:
  floci:
    image: floci/floci:latest
    container_name: floci
    ports:
      - "4566:4566"
      - "1883:1883"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    environment:
      - FLOCI_STORAGE_MODE=hybrid
      - FLOCI_STORAGE_PERSISTENT_PATH=/app/data
      - FLOCI_CORS_ALLOWED_ORIGINS=*
      - FLOCI_SERVICES_IOT_MQTT_AUTO_START=true
      - QUARKUS_HTTP_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - telemetry-net

networks:
  telemetry-net:
    driver: bridge

  # Use http://localhost:4566/_floci/ui
